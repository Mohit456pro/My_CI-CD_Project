name: "CI Pipeline: Build, Lint, Security & Test"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  # ==========================================
  # STAGE 1: Code Quality & Linting
  # ==========================================
  lint:
    name: "Code Quality & Linting (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: |
          echo "Running static syntax and style checks..."
          ruff check .

  # ==========================================
  # STAGE 2: Security & Vulnerability Scanning
  # ==========================================
  security-scan:
    name: "SAST & Dependency Security Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit (Static Application Security Testing - SAST)
        run: |
          echo "Scanning application code for security flaws (hardcoded secrets, insecure functions)..."
          bandit -r src/ -ll

      - name: Run Pip-Audit (Dependency Vulnerabilities / CVEs)
        run: |
          echo "Auditing third-party dependencies for known CVEs..."
          pip-audit -r requirements.txt || true

  # ==========================================
  # STAGE 3: Automated Testing & Coverage
  # ==========================================
  test:
    name: "Unit & Integration Tests (Pytest)"
    runs-on: ubuntu-latest
    needs: [lint, security-scan]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest with Coverage
        run: |
          echo "Executing test suite and calculating code coverage..."
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: code-coverage-report
          path: coverage.xml

  # ==========================================
  # STAGE 4: Container Build & Image Scan
  # ==========================================
  docker-build:
    name: "Build & Scan Container Image"
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ci-cd-demo-service:${{ github.sha }}
          load: true

      - name: Scan Container Image with Trivy (Vulnerabilities)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ci-cd-demo-service:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
